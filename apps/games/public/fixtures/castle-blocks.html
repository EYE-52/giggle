<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Castle Clash acceptance fixture</title><link rel="stylesheet" href="/css/castle-immersive.css"><style>html,body{margin:0;background:#26394f;overflow:hidden}#room{position:fixed;left:12px;top:12px;z-index:20;color:#fff;font:700 13px system-ui}#room summary{display:grid;place-items:center;min-width:78px;height:44px;border-radius:12px;cursor:pointer;background:#263f5af0;list-style:none}#room>div{position:absolute;left:0;top:52px;background:#263f5af5;padding:15px;border-radius:14px;width:220px}#room button{display:block;min-height:44px;margin:7px 0;width:100%;background:#3b5875;color:#fff;border:1px solid #a7bac5;border-radius:9px}#room p{font-size:11px}body [hidden]{display:none!important}</style></head><body><details id="room" class="room-menu"><summary>Room</summary><div><p>Native browser fixture. Real Room authority; the other seats can be driven from this menu.</p><button id="ready-all">Ready all rivals</button><button id="siege">Start siege</button><button id="finish">Finish round clock</button><button id="rematch">Rematch</button><button id="reset">Reset built castles</button><button id="leave">Leave / change game</button></div></details><main id="game"></main><script type="module">
import view from '/js/games/castle-clash.js';
const params=new URLSearchParams(location.search), players=params.get('players')||'4', scenario=params.get('scenario')||'build';
let latest=null, offset=0, readyCount=0;
const ws=new WebSocket(`ws://${location.host}/fixture?players=${players}&scenario=${scenario}&room=${params.get('room')||'castle'}&seat=${params.get('seat')||'0'}`);
const api={now:()=>Date.now()+offset,context:()=>({isHost:latest?.host===latest?.you,sound:true}),send:a=>ws.send(JSON.stringify({t:'action',a,i:latest.instanceId,w:latest.w})),rematch:()=>ws.send(JSON.stringify({t:'rematch'})),lobby:()=>ws.send(JSON.stringify({t:'leave'})),resultsReady:id=>{readyCount++;window.__resultsReady={id,count:readyCount};}};
view.mount(document.querySelector('#game'),api);
ws.onmessage=e=>{const message=JSON.parse(e.data);if(message.t==='state'){latest=message;offset=message.serverNow-Date.now();view.update(document.querySelector('#game'),message,api);}else if(message.t==='lobby'){view.dispose();document.querySelector('#game').innerHTML='<p style="color:white;font:24px system-ui;padding:100px">Returned to lobby. Reload to enter Castle Clash.</p>';}};
for(const [id,t]of [['ready-all','ready-all'],['siege','siege'],['finish','finish'],['rematch','rematch'],['reset','reset'],['leave','leave']])document.querySelector('#'+id).onclick=()=>{document.querySelector('#room').open=false;ws.send(JSON.stringify({t}));};
window.__castle={debug:()=>view._debug(),state:()=>latest,send:a=>api.send(a),fixture:t=>ws.send(JSON.stringify({t})),dispose:()=>view.dispose(),view};
const diagnostics=document.createElement('pre');diagnostics.id='fixture-render-metrics';diagnostics.hidden=true;document.body.append(diagnostics);
setInterval(()=>{diagnostics.textContent=JSON.stringify(view._debug().scene||{});},1000);
</script></body></html>
