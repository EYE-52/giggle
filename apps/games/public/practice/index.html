<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Practice · Game Night</title>
  <script src="/js/boot-theme.js"></script>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app-panels.css">
<script defer src="/js/app-panels.js"></script>
  <link rel="stylesheet" href="/css/practice.css">
  <script defer src="/js/boot-status.js"></script>
</head>
<body class="practice-page" data-family="party">
  <header class="practice-bar">
    <a href="/" class="practice-back" aria-label="Back to Game Night" title="Back to Game Night"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 class="practice-title">Practice</h1>
    <form id="practiceSetup" class="practice-setup" aria-label="Practice setup">
      <!-- The art picker and stepper drive these; they stay as the form's values. -->
      <select id="practiceGame" class="practice-native" aria-hidden="true" tabindex="-1" disabled><option>Loading…</option></select>
      <select id="practiceCount" class="practice-native" aria-hidden="true" tabindex="-1" disabled><option>—</option></select>
      <div class="practice-stepper" role="group" aria-label="Players">
        <button type="button" id="practiceLess" aria-label="Fewer players" disabled>−</button>
        <output id="practiceCountLabel" aria-live="polite"><span class="practice-count-number">–</span><span class="practice-count-unit"></span></output>
        <button type="button" id="practiceMore" aria-label="More players" disabled>+</button>
      </div>
      <button class="btn tb-btn tb-primary" id="practiceStart" disabled>Play</button>
      <button class="btn ghost tb-btn tb-chip" id="practiceRetry" type="button" hidden>Retry</button>
    </form>
    <nav id="practiceControls" class="practice-controls" aria-label="Practice controls" hidden>
      <div id="practiceTabs" class="practice-tabs" role="tablist" aria-label="Choose a player"></div>
      <div class="practice-actions">
        <button id="practiceAll" type="button" aria-pressed="false" aria-label="Show all seats" title="Show all seats"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <button id="practiceReload" type="button" aria-label="Reload this seat" title="Reload this seat"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="practiceStop" type="button" class="practice-stop">End</button>
      </div>
    </nav>
    <details id="practiceGuide" class="practice-info">
      <summary aria-label="About practice" title="About practice">?</summary>
      <div class="practice-info-card">
        <p id="practiceNote">Play every seat yourself, in one window.</p>
        <p id="practicePlayingNote" hidden></p>
        <p>It’s a normal online room: anyone with the code can join. Camera and mic are off here.</p>
      </div>
    </details>
    <span id="practiceStatus" class="practice-status" role="status" aria-live="polite">Getting the games ready…</span>
  </header>
  <main id="practiceTable" class="practice-table">
    <section class="practice-empty boot-view" data-app-boot role="status" aria-busy="true">
      <span class="loading-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <h2 data-boot-title>Shuffling the games…</h2>
      <p data-boot-description></p>
      <a href="/practice/">Reload practice</a>
    </section>
  </main>
  <noscript><p class="practice-note">Practice needs JavaScript. You can still read the <a href="/games/chess/">game guides</a>.</p></noscript>
  <script type="module" src="/js/practice.js"></script>
</body>
</html>
