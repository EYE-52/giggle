<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elevated combat worlds · internal review</title>
<style>*{box-sizing:border-box}html,body{margin:0;font:14px system-ui;background:#132430;color:#d6e5ef}header{padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}strong{font-weight:650;font-size:16px}label{display:flex;align-items:center;gap:6px}select,button{min-height:44px;padding:8px 12px;border:1px solid #436070;border-radius:8px;background:#203747;color:inherit;font:inherit}button{cursor:pointer}main{display:flex;justify-content:center;min-width:max-content;padding:0 14px 14px}iframe{border:0;display:block;background:#162430}details{padding:8px 16px}summary{min-height:36px;cursor:pointer}p{margin:6px 0;color:#9db4c2}#status{color:#9db4c2}</style>
<header><strong>Elevated combat · internal review</strong><label>Map<select id="map"><option value="garden">Alpine Courtyard</option><option value="frost">Frost Quarry</option><option value="neon">Neon Harbor</option></select></label><label>Viewport<select id="size"><option value="1280,800">1280×800 laptop</option><option value="1024,640">1024×640 laptop</option><option value="390,844">390×844 phone</option><option value="568,320">568×320 landscape</option><option value="844,390">844×390 landscape</option></select></label><label>Mode<select id="mode"><option value="art">Art overview · no physics</option><option value="live">Live authority · driving/combat</option></select></label><button id="evidence">Save evidence</button><button id="matrix">Check viewports</button><span id="status" role="status">Loading original assets…</span></header>
<details><summary>Review controls</summary><p>The overview animates a posed model, not gameplay. Live mode uses the isolated server Rapier/combat adapter, real intent packets and snapshots; it is not the released production game.</p><label>Camera<select id="camera"><option value="chase">Chase / near field</option><option value="overview">Whole arena</option><option value="structure">Deck and underpass</option><option value="orbit">Slow orbit · render only</option></select></label><label>Light<select id="phase"><option value="live">Server phase / map default</option><option value="0">Daylight</option><option value="0.65">Sunset</option><option value="1">Readable night</option></select></label><label>Seat<select id="seat"><option value="driver">Pippa</option><option value="rival">Rowan</option></select></label><button id="reset">Fresh round</button></details>
<main><iframe id="game" title="Original elevated arena review" width="1280" height="800" src="/scene?map=garden&mode=art&camera=chase&seat=driver&phase=live"></iframe></main>
<script>
const ids=['map','mode','camera','seat','phase'],frame=document.getElementById('game'),status=document.getElementById('status');let pendingGeometry;
function load(){const q=new URLSearchParams();for(const id of ids)q.set(id,document.getElementById(id).value);frame.src='/scene?'+q;}
for(const id of ids)document.getElementById(id).onchange=async()=>{if(id==='map'||id==='mode')await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({map:document.getElementById('map').value})});load();};
document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split(',');frame.width=w;frame.height=h;status.textContent=w+'×'+h+' live renderer';};
document.getElementById('evidence').onclick=()=>frame.contentWindow.postMessage({type:'save'},location.origin);
document.getElementById('reset').onclick=async()=>{await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({map:document.getElementById('map').value})});frame.contentWindow.postMessage({type:'focus'},location.origin);};
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.type==='status')status.textContent=e.data.text;if(e.data.type==='geometry'&&pendingGeometry){pendingGeometry(e.data.value);pendingGeometry=null;}});
document.getElementById('matrix').onclick=async()=>{
  const button=document.getElementById('matrix');button.disabled=true;const rows=[],failures=[];let checks=0;
  try{
    for(const map of ['garden','frost','neon'])for(const mode of ['art','live'])for(const [w,h]of [[1280,800],[1024,640],[390,844],[568,320]]){
      frame.width=w;frame.height=h;
      const geometry=new Promise((resolve,reject)=>{pendingGeometry=resolve;setTimeout(()=>reject(new Error('bounded scene geometry timeout')),10000);});
      frame.src='/scene?'+new URLSearchParams({map,mode,camera:'chase',seat:'driver',phase:'live',probe:'1'});
      const value=await geometry;rows.push({map,mode,...value});
      const assert=(condition,message)=>{checks++;if(!condition)failures.push({map,mode,w,h,message});};
      assert(value.viewport.width===w&&value.viewport.height===h,'exact viewport');assert(value.document.width===w&&value.document.height===h,'no document overflow');assert(value.canvas.width===w&&value.canvas.height===h,'protected full canvas');assert(value.renderer.calls>0&&value.renderer.triangles>0,'actual loaded renderer');assert(value.errors.length===0,'no runtime errors');
      for(const control of value.controls){assert(control.x>=-.5&&control.y>=-.5&&control.right<=w+.5&&control.bottom<=h+.5,'control stays visible: '+control.label);if(control.interactive)assert(control.width>=44&&control.height>=44,'44px touch target: '+control.label);}
    }
    const value={type:'native elevated viewport matrix',checks,failures,rows};await fetch('/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});status.textContent=(failures.length?'FAIL ':'PASS ')+checks+' checks / '+rows.length+' scenes';
  }catch(error){status.textContent='FAIL '+error.message;}finally{button.disabled=false;const[w,h]=document.getElementById('size').value.split(',');frame.width=w;frame.height=h;load();}
};
</script></html>
