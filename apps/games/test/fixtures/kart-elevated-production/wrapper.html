<!doctype html><meta charset="utf-8"><title>Real elevated Room · responsive QA</title>
<style>body{margin:0;background:#e8edf2;color:#193044;font:14px system-ui}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{font:inherit;padding:8px;min-height:40px}#viewport{margin:0 10px 20px;border:1px solid #70899c;width:390px;height:844px}iframe{display:block;border:0;width:100%;height:100%}pre{white-space:pre-wrap;margin:10px;max-width:1000px}p{margin:8px 10px}</style>
<header><b>Development QA · actual app</b><button data-size="1280,800">Desktop 1280×800</button><button data-size="390,844">Portrait 390×844</button><button data-size="568,320">Landscape 568×320</button><button id="companion">Join neutral witness</button><button id="leave">Disconnect witness</button><button id="geometry">Read geometry</button><button id="lose">Lose WebGL context</button></header>
<p>Only viewport sizing and explicit graphics fault injection. Real room snapshots and input. Desktop pointer capabilities remain desktop; select Touch in Room for touch-control review.</p>
<div id="viewport"><iframe id="app" src="/" allow="fullscreen" allowfullscreen></iframe></div><pre id="report">Create an isolated QA room using the real app, then join a neutral witness.</pre>
<script>
const frame=document.getElementById('app'),box=document.getElementById('viewport'),report=document.getElementById('report');
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const[w,h]=b.dataset.size.split(',');box.style.width=w+'px';box.style.height=h+'px';report.textContent='Actual iframe '+w+'×'+h;};
document.getElementById('companion').onclick=async()=>{const r=await fetch('/__qa/companion',{method:'POST'});report.textContent=await r.text();};
document.getElementById('leave').onclick=async()=>{const r=await fetch('/__qa/leave-companions',{method:'POST'});report.textContent=await r.text();};
function geometry(){const d=frame.contentDocument,w=frame.contentWindow,rect=sel=>{const n=d.querySelector(sel),r=n?.getBoundingClientRect();return r?{x:r.x,y:r.y,width:r.width,height:r.height,hidden:n.hidden||!n.getClientRects().length}:null;};
  return{at:Date.now(),viewport:{width:w.innerWidth,height:w.innerHeight},document:{width:d.documentElement.scrollWidth,height:d.documentElement.scrollHeight},focused:d.activeElement?.tagName,touchAutomatic:d.querySelector('.pke-touch')?.hidden,roomOpen:d.getElementById('roomMenu')?.open,rects:Object.fromEntries(['.pk','.pk canvas','.pk-readout','.pk-stick','#pk-tb','.pke','.pke-stage canvas','#roomMenu>summary','.pke-top time','.kart-item','.pke-bottom','.pke-touch','.pke-stick','.pke-actions','[data-use]','[data-nitro]','[data-brake]','.pke-result','#rematch','.pke-loading'].map(s=>[s,rect(s)]))};}
document.getElementById('geometry').onclick=()=>{report.textContent=JSON.stringify(geometry(),null,2);};
document.getElementById('lose').onclick=()=>{const c=frame.contentDocument.querySelector('.pke-stage canvas');const gl=c?.getContext('webgl2');const extension=gl?.getExtension('WEBGL_lose_context');if(extension){extension.loseContext();report.textContent='Explicit manual WEBGL_lose_context request sent to actual renderer.';}else report.textContent='No active WebGL2 context to lose.';};
</script>
