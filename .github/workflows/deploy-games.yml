# Manual release only. Never create credentials just to enable this workflow.
# See apps/games/DEPLOYMENT_PLAN.md for the incident, room-reset and provider checks.
name: Deploy Games

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed current main commit (full 40-character SHA)
        required: true
        type: string
      railway_incident_resolved:
        description: Railway incident QH8L8B3E is resolved; provider checks passed
        required: true
        default: false
        type: boolean
      room_reset_approved:
        description: Production release and loss of in-memory rooms are approved
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-games-production
  cancel-in-progress: false

env:
  RAILWAY_PROJECT: 2e301782-c882-4553-94e4-61b898d98f1f
  RAILWAY_SERVICE: 163cf83c-20a2-40f1-8795-d503a9c7840b
  RAILWAY_ENVIRONMENT: bd367c27-b9f2-4715-a40c-842f19a1f66c
  BACKEND_URL: https://giggle-play-production.up.railway.app
  RELEASE_SOURCE_SHA: ${{ inputs.release_sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/games
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require an approved current main release
        env:
          INCIDENT_RESOLVED: ${{ inputs.railway_incident_resolved }}
          ROOM_RESET_APPROVED: ${{ inputs.room_reset_approved }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$INCIDENT_RESOLVED" = true
          test "$ROOM_RESET_APPROVED" = true
          test "$RELEASE_SOURCE_SHA" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/games/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../../server
      - run: npm test
      - name: Verify canonical cross-app and nested release contracts
        run: node test/canonical-bridge.js && node test/canonical-release.js
      - run: npm run build

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/games
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/games/package-lock.json
      - name: Require all credentials before restarting any service
        run: node scripts/release-gate.js credentials
      - run: npm ci
      - run: npm run build
      - name: Stamp the immutable source and built bytes
        run: node scripts/release-identity.js stamp
      - name: Upload the game server and capture its exact deployment identity
        run: |
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          npx --yes @railway/cli@5.63.1 up . --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT" --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" > "$RUNNER_TEMP/backend-upload.json"
      - name: Require the new exact backend deployment to succeed
        run: |
          for i in $(seq 1 60); do
            npx --yes @railway/cli@5.63.1 deployment list --json --limit 100 \
              --project "$RAILWAY_PROJECT" --service "$RAILWAY_SERVICE" \
              --environment "$RAILWAY_ENVIRONMENT" > "$RUNNER_TEMP/backend-after.json"
            if curl --connect-timeout 5 --max-time 10 -fsS -H 'Cache-Control: no-cache' \
              "$BACKEND_URL/config.json?release=$RELEASE_SOURCE_SHA" > "$RUNNER_TEMP/backend-config.json" && \
              node scripts/release-gate.js backend "$RUNNER_TEMP/backend-config.json" public/release.json \
              "$RUNNER_TEMP/backend-after.json" "$RUNNER_TEMP/backend-upload.json"; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::No new successful Railway deployment with the exact source/build identity'
          exit 1
      - name: Recheck the backend immediately before frontend promotion
        run: |
          npx --yes @railway/cli@5.63.1 deployment list --json --limit 100 \
            --project "$RAILWAY_PROJECT" --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" > "$RUNNER_TEMP/backend-after.json"
          curl --connect-timeout 5 --max-time 10 -fsS -H 'Cache-Control: no-cache' \
            "$BACKEND_URL/config.json?release=$RELEASE_SOURCE_SHA" > "$RUNNER_TEMP/backend-config.json"
          node scripts/release-gate.js backend "$RUNNER_TEMP/backend-config.json" public/release.json \
            "$RUNNER_TEMP/backend-after.json" "$RUNNER_TEMP/backend-upload.json"
      - name: Deploy the matched frontend to production
        run: node scripts/deploy-frontend.js
      - name: Verify the frontend's own static build identity
        run: |
          curl --connect-timeout 5 --max-time 20 -fsS -H 'Cache-Control: no-cache' \
            "https://play.gigglemeet.com/release.json?release=$RELEASE_SOURCE_SHA" > "$RUNNER_TEMP/frontend-release.json"
          node scripts/release-gate.js frontend "$RUNNER_TEMP/frontend-release.json" public/release.json
