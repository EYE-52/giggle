name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: API server tests
    runs-on: ubuntu-latest
    services:
      # Lock, queue and chat-dedup tests talk to a real Redis.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  apps:
    name: Web, mobile and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build web app
        run: pnpm build:desktop
        env:
          # Placeholder: the build only needs a valid URL, never a real API.
          NEXT_PUBLIC_BACKEND_URL: https://api.example.invalid

  games:
    name: Game engine and cross-app bridge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/games/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix apps/games
      - run: npm ci --prefix server
      - run: npm run test:games
      - run: npm run test:games:integration
      - run: npm run build:games
