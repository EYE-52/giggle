<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-label="SECTION · Garden Crown"><rect width="100%" height="100%" fill="#102633"/><g font-family="Arial, sans-serif"><text x="30" y="40" font-size="27" fill="#f4f1dc">SECTION · Garden Crown</text><text x="30" y="69" font-size="15" fill="#b9cccf">Schematic route height profile · horizontal distance is not to scale</text><path d="M45 280H950" stroke="#294653" stroke-dasharray="5 6"/><path d="M45 140H950" stroke="#294653" stroke-dasharray="5 6"/><polyline points="330,292 401.5,292 499,201 713.5,201 804.5,292 889,292" fill="none" stroke="#eec764" stroke-width="11" stroke-linejoin="round"/><path d="M330 304H920" stroke="#79bda8" stroke-width="9"/><text x="30" y="337" font-size="15" fill="#79bda8">Ground bypass stays open; every upper route has two ways down.</text><text x="30" y="130" font-size="17" fill="#eec764">L1 +7 m · crown promenade</text><text x="30" y="159" font-size="17" fill="#79bda8">L0 0 m · fountain / garden rooms</text><text x="30" y="370" font-size="16" fill="#f4f1dc">Garden rooms connect under the crown. Fountain stays below the sightline.</text><text x="30" y="403" font-size="14" fill="#b9cccf">Heights are support surfaces. Ramps need measured runs; this is not a ramp angle drawing.</text></g></svg>