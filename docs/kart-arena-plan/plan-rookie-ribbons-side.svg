<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-label="SECTION · Rookie Ribbons"><rect width="100%" height="100%" fill="#102633"/><g font-family="Arial, sans-serif"><text x="30" y="40" font-size="27" fill="#f4f1dc">SECTION · Rookie Ribbons</text><text x="30" y="69" font-size="15" fill="#b9cccf">Schematic route height profile · horizontal distance is not to scale</text><path d="M45 280H950" stroke="#294653" stroke-dasharray="5 6"/><path d="M45 160H950" stroke="#294653" stroke-dasharray="5 6"/><polyline points="330,292 408,292 486,214 681,214 759,292 889,292" fill="none" stroke="#eec764" stroke-width="11" stroke-linejoin="round"/><path d="M330 304H920" stroke="#79bda8" stroke-width="9"/><text x="30" y="337" font-size="15" fill="#79bda8">Ground bypass stays open; every upper route has two ways down.</text><text x="30" y="130" font-size="17" fill="#eec764">L1 +6 m · arch bridge</text><text x="30" y="159" font-size="17" fill="#79bda8">L0 0 m · both lobes</text><text x="30" y="370" font-size="16" fill="#f4f1dc">Two low ramps reach the arch. Open lower crossing runs beneath it.</text><text x="30" y="403" font-size="14" fill="#b9cccf">Heights are support surfaces. Ramps need measured runs; this is not a ramp angle drawing.</text></g></svg>