<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-label="SECTION · Skyport Split"><rect width="100%" height="100%" fill="#102633"/><g font-family="Arial, sans-serif"><text x="30" y="40" font-size="27" fill="#f4f1dc">SECTION · Skyport Split</text><text x="30" y="69" font-size="15" fill="#b9cccf">Schematic route height profile · horizontal distance is not to scale</text><path d="M45 280H950" stroke="#294653" stroke-dasharray="5 6"/><path d="M45 175H950" stroke="#294653" stroke-dasharray="5 6"/><path d="M45 70H950" stroke="#294653" stroke-dasharray="5 6"/><polyline points="330,292 408,292 505.5,223.75 551,223.75 629,155.5 713.5,155.5 778.5,223.75 824,223.75 889,292" fill="none" stroke="#eec764" stroke-width="11" stroke-linejoin="round"/><path d="M330 304H920" stroke="#79bda8" stroke-width="9"/><text x="30" y="337" font-size="15" fill="#79bda8">Ground bypass stays open; every upper route has two ways down.</text><text x="30" y="130" font-size="17" fill="#c49df4">L2 +20 m · rooftop loop</text><text x="30" y="159" font-size="17" fill="#eec764">L1 +10 m · parking loop</text><text x="30" y="188" font-size="17" fill="#79bda8">L0 0 m · street saddle</text><text x="30" y="370" font-size="16" fill="#f4f1dc">Two towers face across a street saddle; one safe roof bridge bypasses the gap.</text><text x="30" y="403" font-size="14" fill="#b9cccf">Heights are support surfaces. Ramps need measured runs; this is not a ramp angle drawing.</text></g></svg>